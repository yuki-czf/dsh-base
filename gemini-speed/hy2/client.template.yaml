# HY2 三车道客户端配置模板
# 用法：复制为 client.yaml，替换下面两个占位符（值从家里 C:\Users\zifeng\hy2\client.yaml 或 hy2-portable v2 包抄）
#   __VPS_IP__         VPS 地址
#   __TUNNEL_PASSWORD__ HY2 隧道密码
# ⚠️ 真实 client.yaml 永远不要提交进本仓库

server: __VPS_IP__:8445

auth: __TUNNEL_PASSWORD__

tls:
  sni: www.bing.com
  insecure: true

socks5:
  listen: 127.0.0.1:8320

http:
  listen: 127.0.0.1:8321

tcpForwarding:
- name: cpa-lane
  listen: 127.0.0.1:9443
  remote: 127.0.0.1:8318
- name: aistudio-lane
  listen: 127.0.0.1:9444
  remote: 127.0.0.1:2048
- name: web-lane
  listen: 127.0.0.1:9445
  remote: 127.0.0.1:8083

bandwidth:
  up: 4 mbps
  down: 8 mbps

fastOpen: true
