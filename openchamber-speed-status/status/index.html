<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Speed</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; }
  body {
    font-family: var(--oc-font, -apple-system, "SF Pro Text", system-ui, "Microsoft YaHei", sans-serif);
    font-size: 12px;
    line-height: 1.4;
    color: var(--oc-fg, inherit);
    background: transparent;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  #root { padding: 3px 0; }

  /* macOS 次级卡片：前景色淡染，浅/深主题自适应 */
  .frost {
    background: color-mix(in srgb, var(--oc-fg, #888888) 7%, transparent);
    border: 1px solid color-mix(in srgb, var(--oc-fg, #888888) 11%, transparent);
    border-radius: 10px;
    padding: 6px 9px 7px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
    overflow: hidden;
  }

  /* 头部：速度为主角，可换行 */
  .head {
    display: flex;
    align-items: baseline;
    gap: 5px;
    flex-wrap: wrap;
    min-width: 0;
  }

  /* 指标行：两列自适应，窄容器自动堆叠 */
  .metrics {
    display: flex;
    flex-wrap: wrap;
    gap: 3px 12px;
    min-width: 0;
  }
  .m {
    display: inline-flex;
    align-items: baseline;
    gap: 4px;
    min-width: 0;
    max-width: 100%;
  }

  .breath {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--oc-muted, #999);
    align-self: center; flex: none;
    transition: background .3s ease;
  }
  .breath.live {
    background: var(--oc-success, #22a06b);
    animation: br 1.6s ease-in-out infinite;
  }
  @keyframes br {
    0%, 100% { opacity: .35; transform: scale(.85); }
    50%      { opacity: 1;   transform: scale(1.15); }
  }

  .big {
    font-family: var(--oc-mono, ui-monospace, "SF Mono", Consolas, monospace);
    font-size: 19px; font-weight: 700;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
    display: inline-block;
    transform-origin: 50% 60%;
    line-height: 1.2;
  }
  .big.pop { animation: pop .5s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes pop {
    0%   { transform: scale(.82); opacity: .45; }
    100% { transform: scale(1);   opacity: 1; }
  }

  .unit { font-size: 10.5px; color: var(--oc-muted, #999); flex: none; }
  .lbl  { font-size: 10px; color: var(--oc-muted, #999); flex: none; }
  .kv {
    font-family: var(--oc-mono, ui-monospace, "SF Mono", Consolas, monospace);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  .chip {
    font-size: 9px; line-height: 1.6;
    padding: 0 5px; border-radius: 5px;
    align-self: center; flex: none;
    background: color-mix(in srgb, var(--oc-muted, #999) 22%, transparent);
    color: var(--oc-muted, #999);
    transition: background .3s ease, color .3s ease;
  }
  .chip.fast { background: color-mix(in srgb, var(--oc-success, #22a06b) 22%, transparent); color: var(--oc-success, #22a06b); }
  .chip.mid  { background: color-mix(in srgb, var(--oc-warning, #e2a336) 24%, transparent); color: var(--oc-warning, #e2a336); }
  .chip.slow { background: color-mix(in srgb, var(--oc-error, #d64545) 20%, transparent); color: var(--oc-error, #d64545); }

  .muted { color: var(--oc-muted, #999); }

  /* 极窄容器（<170px）：再压缩字号与间距 */
  @media (max-width: 170px) {
    .frost { padding: 5px 7px 6px; border-radius: 9px; }
    .big { font-size: 17px; }
    .kv { font-size: 10.5px; }
    .metrics { gap: 2px 8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .breath.live { animation: none; opacity: 1; transform: none; }
    .big.pop { animation: none; }
    .breath { transition: none; }
  }
</style>
</head>
<body>
<div id="root"><span class="muted">Speed: 等待会话…</span></div>
<script src="main.js"></script>
</body>
</html>
